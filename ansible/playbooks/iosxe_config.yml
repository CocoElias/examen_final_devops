---
- name: TechCorp - Automatización y auditoría en Cisco IOS-XE
  hosts: iosxe_routers
  gather_facts: false
  vars:
    loopback_id: "Loopback100"
    loopback_desc: "Gestionado por Ansible - TechCorp"
    loopback_ip: "10.100.100.1 255.255.255.0"

  tasks:
    - name: 1. Consultar estado inicial de interfaces (Pre-check)
      ios_command:
        commands:
          - show ip interface brief
      register: pre_check

    - name: 2. Configurar interfaz Loopback100 corporativa
      ios_config:
        parents:
          - "interface {{ loopback_id }}"
        lines:
          - "description {{ loopback_desc }}"
          - "ip address {{ loopback_ip }}"
          - "no shutdown"

    - name: 3. Verificar configuración aplicada (Post-check)
      ios_command:
        commands:
          - "show ip interface brief | include Loopback100"
      register: post_check

    - name: 4. Mostrar resultado de verificación
      debug:
        var: post_check.stdout_lines